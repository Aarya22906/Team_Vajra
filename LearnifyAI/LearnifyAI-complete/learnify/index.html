      // Apply the saved theme before first paint to avoid a flash.
      try { const t = localStorage.getItem('learnify-theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch {}
    </script>
